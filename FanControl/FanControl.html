<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FanControl — MVP</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #14161a; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif; color: #e6e6e6; }
  *, *::before, *::after { box-sizing: border-box; }
  body { --dc-bg: #1a1c20; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app/window-shell.jsx"></script>
<script type="text/babel" src="app/atoms.jsx"></script>
<script type="text/babel" src="app/curve-editor.jsx"></script>
<script type="text/babel" src="app/main-mvp.jsx"></script>
<script type="text/babel" src="app/curve-mvp.jsx"></script>

<script type="text/babel">
const FC_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#3b82f6",
  "tempUnit": "C"
}/*EDITMODE-END*/;

function ArtboardWrap({ children }) {
  return (
    <div style={{
      width: 360, height: 640,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>{children}</div>
  );
}

function MainArtboard({ accent, tempUnit, sheetOpen, setSheetOpen }) {
  return (
    <ArtboardWrap>
      <FCWindow accent={accent} title="FanControl" width={360} height={640}>
        <MainMVP accent={accent} tempUnit={tempUnit} onOpenCurve={() => setSheetOpen(true)} />
        {sheetOpen && <CurveMVP accent={accent} tempUnit={tempUnit} onClose={() => setSheetOpen(false)} />}
      </FCWindow>
    </ArtboardWrap>
  );
}

function CurveArtboard({ accent, tempUnit }) {
  return (
    <ArtboardWrap>
      <FCWindow accent={accent} title="FanControl" width={360} height={640}>
        <div style={{ position: 'relative', height: '100%' }}>
          <CurveMVP accent={accent} tempUnit={tempUnit} onClose={() => {}} animate={false} />
        </div>
      </FCWindow>
    </ArtboardWrap>
  );
}

function App() {
  const [t, setTweak] = useTweaks(FC_TWEAK_DEFAULTS);
  const [sheetOpen, setSheetOpen] = React.useState(false);

  return (
    <>
      <DesignCanvas>
        <DCSection id="mvp" title="FanControl · MVP" subtitle="Tela única, essencial. Clique em 'Edit fan curve' para abrir a curva.">
          <DCArtboard id="main" label="Main window" width={360} height={640}>
            <MainArtboard accent={t.accent} tempUnit={t.tempUnit}
                          sheetOpen={sheetOpen} setSheetOpen={setSheetOpen} />
          </DCArtboard>
          <DCArtboard id="curve" label="Curve editor" width={360} height={640}>
            <CurveArtboard accent={t.accent} tempUnit={t.tempUnit} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakColor label="Accent" value={t.accent} onChange={v => setTweak('accent', v)} />
        <TweakSection label="Display" />
        <TweakRadio label="Temperature" value={t.tempUnit}
                    options={['C', 'F']}
                    onChange={v => setTweak('tempUnit', v)} />
        <TweakSection label="Demo" />
        <TweakButton label={sheetOpen ? 'Close curve editor' : 'Open curve editor'}
                     onClick={() => setSheetOpen(!sheetOpen)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
