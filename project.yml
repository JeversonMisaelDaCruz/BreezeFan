name: BreezeFan
options:
  bundleIdPrefix: com.breezefan
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ONLY_ACTIVE_ARCH: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  BreezeFan:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Shared
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breezefan.app
        PRODUCT_NAME: BreezeFan
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_LSUIElement: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: App/BreezeFan.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleName: BreezeFan
        CFBundleDisplayName: BreezeFan
        CFBundleIdentifier: com.breezefan.app
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    dependencies:
      - target: BreezeFanHelper
        embed: false
    postBuildScripts:
      - name: "Embed Helper into Library/LaunchDaemons"
        script: |
          set -euo pipefail
          APP_FRAMEWORKS_DIR="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Library/LaunchDaemons"
          APP_HELPERS_DIR="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/MacOS/Helpers"
          mkdir -p "$APP_FRAMEWORKS_DIR"
          mkdir -p "$APP_HELPERS_DIR"
          # Copy helper binary
          cp -f "${BUILT_PRODUCTS_DIR}/BreezeFanHelper" "$APP_HELPERS_DIR/BreezeFanHelper"
          # Copy launchd plist
          cp -f "${SRCROOT}/Helper/com.breezefan.helper.plist" "$APP_FRAMEWORKS_DIR/com.breezefan.helper.plist"
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchDaemons/com.breezefan.helper.plist
          - $(BUILT_PRODUCTS_DIR)/$(WRAPPER_NAME)/Contents/MacOS/Helpers/BreezeFanHelper

  BreezeFanHelper:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Helper
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breezefan.helper
        PRODUCT_NAME: BreezeFanHelper
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Helper/BreezeFanHelper.entitlements
    info:
      path: Helper/Info.plist
      properties:
        CFBundleIdentifier: com.breezefan.helper
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"

  BreezeFanTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breezefan.tests
        PRODUCT_NAME: BreezeFanTests
        SWIFT_OBJC_BRIDGING_HEADER: ""
    dependencies:
      - target: BreezeFan

schemes:
  BreezeFan:
    build:
      targets:
        BreezeFanHelper: all
        BreezeFan: all
        BreezeFanTests: [test]
    test:
      targets:
        - BreezeFanTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
